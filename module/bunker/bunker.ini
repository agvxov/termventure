[bunker]
# paper-encounter: a piece of paper with a code drifts by.
# bunker-encounter: a door is found in the mountainside.
trigger        = { "paper-encounter" => 100, "bunker-encounter" => 150 }
# How many codes can be out there at once; the oldest is forgotten first.
max-concurrent = 3
# Size and alphabet of the generated codes.
code-size      = 3
code-alphabet  = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
# What an opened bunker holds
loot-table     = echo stone
